<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Recetas</title>
    <link rel="stylesheet" href="">
</head>
<body>

    <h1>Generador de Recetas 🍳</h1>

    <form id="recipeForm">
        <label>Nombre de la receta:</label>
        <input type="text" id="name" required>

        <label>Tiempo de preparación (minutos):</label>
        <input type="number" id="time" required>

        <label>Ingredientes (uno por línea):</label>
        <textarea id="ingredients" rows="5" required></textarea>

        <label>Pasos de preparación (uno por línea):</label>
        <textarea id="steps" rows="5" required></textarea>

        <button type="submit">Generar receta</button>
    </form>

    <div id="recipeOutput"></div>

    <script src="script.js"></script>
</body>
</html>
