<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculadora">
        <div class="pantalla__calculadora">0</div>
        <div class="teclas__calculadora">
            <button class="tecla--operador" data-accion="sumar">+</button>
            <button class="tecla--operador" data-accion="restar">-</button>
            <button class="tecla--operador" data-accion="multiplicar">×</button>
            <button class="tecla--operador" data-accion="dividir">÷</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>0</button>
            <button data-accion="decimal">.</button>
            <button data-accion="limpiar">AC</button>
            <button class="tecla--igual" data-accion="calcular">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
